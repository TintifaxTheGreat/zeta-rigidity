name = "zeta-rigidity"
version = "0.2.0"
description = "A rigidity theorem: a valuation whose Dirichlet series matches the Riemann zeta function must be the ordinary primes."
keywords = [
  "math",
  "number-theory",
  "analytic-number-theory",
  "prime-numbers",
  "riemann-zeta-function",
  "formalization",
]
license = "Apache-2.0"
defaultTargets = ["ZetaRigidity"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.1"

[[lean_lib]]
name = "ZetaRigidity"
