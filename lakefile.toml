name = "zeta-rigidity"
version = "0.1.0"
keywords = ["math"]
license = "Apache-2.0"
defaultTargets = ["ZetaRigidity"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.1"

[[lean_lib]]
name = "ZetaRigidity"
